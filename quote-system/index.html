<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request a Quote — MH Modern Highline</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    .quote-section { max-width: 900px; margin: 0 auto; }
    .quote-form { background: var(--white); border-radius: 8px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--navy); font-size: 0.9rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.95rem;
    }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-submit {
      background: var(--blue);
      color: white;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }
    .form-submit:hover { background: var(--blue-dark); }
    .form-submit:disabled { background: #ccc; cursor: not-allowed; }
    .form-message { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; }
    .form-message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .form-message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .products-list { background: var(--off); padding: 1.5rem; border-radius: 6px; margin-bottom: 2rem; }
    .products-list h3 { color: var(--navy); margin-bottom: 1rem; }
    .product-checkbox { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; align-items: center; }
    .product-checkbox input { cursor: pointer; }
    .product-checkbox label { cursor: pointer; margin: 0; font-weight: 400; }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <h1>Request a Quote</h1>
    <p>Get a custom quote for your hose and piping needs. Tell us what you need and we'll provide a detailed estimate.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="quote-section">
      <div class="quote-form">
        <h2 style="margin-bottom: 2rem; color: var(--navy);">Quote Request Form</h2>

        <form id="quoteForm">
          <div class="products-list">
            <h3>Products Interested In *</h3>
            <div class="product-checkbox">
              <input type="checkbox" id="product1" name="products" value="Hydraulic Hoses"/>
              <label for="product1">Hydraulic Hoses and Pipes</label>
            </div>
            <div class="product-checkbox">
              <input type="checkbox" id="product2" name="products" value="Brake Hoses"/>
              <label for="product2">Brake Hoses and Pipes</label>
            </div>
            <div class="product-checkbox">
              <input type="checkbox" id="product3" name="products" value="AC Hoses"/>
              <label for="product3">Air Conditioning Hoses and Pipes</label>
            </div>
            <div class="product-checkbox">
              <input type="checkbox" id="product4" name="products" value="High Pressure Hoses"/>
              <label for="product4">High Pressure Hoses</label>
            </div>
            <div class="product-checkbox">
              <input type="checkbox" id="product5" name="products" value="Power Steering"/>
              <label for="product5">Power Steering Hoses and Pipes</label>
            </div>
            <div class="product-checkbox">
              <input type="checkbox" id="product6" name="products" value="Aerospace"/>
              <label for="product6">Aerospace Refuelling Hoses</label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="firstName" required/>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" name="lastName" required/>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="company">Company *</label>
              <input type="text" id="company" name="company" required/>
            </div>
            <div class="form-group">
              <label for="industry">Industry *</label>
              <select id="industry" name="industry" required>
                <option value="">Select industry...</option>
                <option value="Automotive">Automotive</option>
                <option value="Aerospace">Aerospace & Defense</option>
                <option value="Oil & Gas">Oil & Gas</option>
                <option value="Construction">Construction</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Marine">Marine & Offshore</option>
                <option value="Mining">Mining</option>
                <option value="Food & Beverage">Food & Beverage</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" required/>
            </div>
            <div class="form-group">
              <label for="phone">Phone *</label>
              <input type="tel" id="phone" name="phone" required/>
            </div>
          </div>

          <div class="form-group">
            <label for="quantity">Estimated Quantity *</label>
            <input type="text" id="quantity" name="quantity" placeholder="e.g., 1000 units per month" required/>
          </div>

          <div class="form-group">
            <label for="specifications">Specifications & Requirements</label>
            <textarea id="specifications" name="specifications" placeholder="Tell us about the specifications, dimensions, materials, certifications needed..."></textarea>
          </div>

          <div class="form-group">
            <label for="timeline">Timeline / Delivery Date Needed</label>
            <input type="text" id="timeline" name="timeline" placeholder="e.g., ASAP, Q4 2024"/>
          </div>

          <button type="submit" class="form-submit">Request Quote</button>
          <div id="formMessage" class="form-message"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="../shared.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3aLG20fCBwMv-5yuj0CLS4EkKTXHhRg4",
    authDomain: "mh-modern-highline.firebaseapp.com",
    projectId: "mh-modern-highline",
    storageBucket: "mh-modern-highline.firebasestorage.app",
    messagingSenderId: "798286234103",
    appId: "1:798286234103:web:0c2f291938f952f4416ef2",
    measurementId: "G-65DJRE0D8K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('quoteForm');
  const messageDiv = document.getElementById('formMessage');
  const submitBtn = form.querySelector('.form-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const selectedProducts = Array.from(document.querySelectorAll('input[name="products"]:checked')).map(el => el.value);

    if (selectedProducts.length === 0) {
      messageDiv.textContent = '✗ Please select at least one product.';
      messageDiv.className = 'form-message error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    messageDiv.className = 'form-message';

    try {
      const quoteData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        company: document.getElementById('company').value,
        industry: document.getElementById('industry').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        products: selectedProducts,
        quantity: document.getElementById('quantity').value,
        specifications: document.getElementById('specifications').value,
        timeline: document.getElementById('timeline').value,
        timestamp: serverTimestamp(),
        status: 'pending',
        read: false
      };

      await addDoc(collection(db, "quotes"), quoteData);

      messageDiv.textContent = '✓ Quote request submitted! We\'ll review and contact you within 24 hours.';
      messageDiv.className = 'form-message success';
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request Quote';
    } catch (error) {
      console.error('Error:', error);
      messageDiv.textContent = '✗ Error submitting quote request. Please try again.';
      messageDiv.className = 'form-message error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request Quote';
    }
  });
</script>
</body>
</html>
