<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b73a8">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery — MH Modern Highline</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .gallery-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
    .gallery-grid img { width:100%; height:340px; object-fit:cover; border-radius:6px; cursor:pointer; transition:transform 0.25s, box-shadow 0.25s; }
    .gallery-grid img:hover { transform:scale(1.015); box-shadow:0 10px 30px rgba(0,0,0,0.18); }
    /* Lightbox */
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:2000; align-items:center; justify-content:center; padding:2rem; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:4px; }
    .lightbox-close { position:absolute; top:1.5rem; right:2rem; color:white; font-size:2rem; cursor:pointer; background:none; border:none; line-height:1; }
    /* Video section */
    .video-section { padding:80px 0; background:var(--off); }
    .video-wrap { max-width:820px; margin:0 auto; border-radius:8px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.15); }
    .video-wrap video { width:100%; display:block; }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.mhhose.com"},
      {"@type": "ListItem", "position": 2, "name": "Gallery", "item": "https://www.mhhose.com/gallery.html"}
    ]
  }
  </script>
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <h1>Gallery</h1>
    <p>A look inside our manufacturing facility and product range — state-of-the-art equipment and precision-engineered solutions.</p>
  </div>
</section>

<!-- VIDEO GALLERY -->
<section class="video-section" id="video">
  <div class="container">
    <div class="section-title">
      <span class="eyebrow">Video</span>
      <h2>See MH in Action</h2>
      <p>A look at our manufacturing process and product capabilities.</p>
    </div>
    <div class="video-wrap">
      <iframe width="100%" style="aspect-ratio:16/9;display:block;border:none;" src="https://www.youtube.com/embed/7NaagLWWet0" title="MH Modern Highline" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</section>

<!-- PHOTO GALLERY -->
<section class="section">
  <div class="container">
    <div class="section-title">
      <span class="eyebrow">Photos</span>
      <h2>Our Facility & Products</h2>
    </div>
    <div class="gallery-grid" id="gallery">
      <img src="img-1.jpg" alt="CNC Tube Bender — MH Modern Highline" onclick="openLightbox(this.src)"/>
      <img src="img-2.jpg" alt="OKUMA GENOS L2000-e CNC Lathe" onclick="openLightbox(this.src)"/>
      <img src="img-3.png" alt="CNC Control Panel" onclick="openLightbox(this.src)"/>
      <img src="img-4.png" alt="Lathe Tooling Interior" onclick="openLightbox(this.src)"/>
      <img src="img-5.png" alt="Quality Control — Caliper Measurement" onclick="openLightbox(this.src)"/>
      <img src="img-6.png" alt="YLM Tube Bender Machine" onclick="openLightbox(this.src)"/>
      <img src="img-7.png" alt="Microscope Inspection — Product QA" onclick="openLightbox(this.src)"/>
      <img src="gallery-new1.png" alt="MH Hose Products" onclick="openLightbox(this.src)"/>
      <img src="gallery-new2.png" alt="MH Pipe Assembly" onclick="openLightbox(this.src)"/>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Gallery image"/>
</div>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3aLG20fCBwMv-5yuj0CLS4EkKTXHhRg4",
    authDomain: "mh-modern-highline.firebaseapp.com",
    projectId: "mh-modern-highline",
    storageBucket: "mh-modern-highline.firebasestorage.app",
    messagingSenderId: "798286234103",
    appId: "1:798286234103:web:0c2f291938f952f4416ef2",
    measurementId: "G-65DJRE0D8K"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  logEvent(analytics, 'page_view', { page_title: 'Gallery' });
</script>
</body>
</html>
